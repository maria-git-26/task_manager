<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SynQ — Вход</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">

    <!-- LEFT: FORM -->
    <section class="form-side">

      <div class="brand">
        <span class="brand-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="check.png">
            <rect x="1" y="1" width="22" height="22" rx="7" stroke="#1f2a44" stroke-width="1.6"/>
            <path d="M7 12.5L10.5 16L17 9" stroke="#1f2a44" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <div class="brand-text">
          <span class="brand-name">SynQ</span>
          <span class="brand-tag">Task manager for modern teams</span>
        </div>
      </div>

      <div class="welcome">
        <h1>Welcome back <span class="wave">👋</span></h1>
        <p>Войдите, чтобы продолжить управление задачами и проектами</p>
      </div>

      <form id="login-form" novalidate>

        <div class="field">
          <label for="email">Почта</label>
          <div class="input-wrap">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 6.5C3 5.67157 3.67157 5 4.5 5H19.5C20.3284 5 21 5.67157 21 6.5V17.5C21 18.3284 20.3284 19 19.5 19H4.5C3.67157 19 3 18.3284 3 17.5V6.5Z" stroke="#8a94a6" stroke-width="1.5"/>
              <path d="M4 6.5L12 13L20 6.5" stroke="#8a94a6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <input type="email" id="email" name="email" placeholder="вы@example.com" required>
          </div>
        </div>

        <div class="field">
          <label for="password">Пароль</label>
          <div class="input-wrap">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="5" y="10" width="14" height="10" rx="2" stroke="#8a94a6" stroke-width="1.5"/>
              <path d="M8 10V7.5C8 5.567 9.567 4 11.5 4H12.5C14.433 4 16 5.567 16 7.5V10" stroke="#8a94a6" stroke-width="1.5"/>
            </svg>
            <input type="password" id="password" name="password" placeholder="Введите пароль" required>
            <button type="button" class="toggle-visibility" id="toggle-password" aria-label="Показать пароль">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1 12C1 12 5 5 12 5C19 5 23 12 23 12C23 12 19 19 12 19C5 19 1 12 1 12Z" stroke="#8a94a6" stroke-width="1.5" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="3" stroke="#8a94a6" stroke-width="1.5"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="row-between">
          <label class="checkbox">
            <input type="checkbox" id="remember" checked>
            <span class="box"></span>
            Запомнить меня
          </label>
          <a href="#" class="link-muted">Забыли пароль?</a>
        </div>

        <button type="submit" class="btn-primary">Войти</button>

        <div class="divider"><span>or log in with</span></div>

        <button type="button" class="btn-oauth">
          <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
            <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.617z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
            <path fill="#FBBC05" d="M3.964 10.706A5.41 5.41 0 0 1 3.68 9c0-.593.102-1.17.284-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z"/>
            <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.167 6.656 3.58 9 3.58z"/>
          </svg>
          Войти через Google
        </button>

        <button type="button" class="btn-oauth">
          <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
            <rect x="1" y="1" width="7.5" height="7.5" fill="#F25022"/>
            <rect x="9.5" y="1" width="7.5" height="7.5" fill="#7FBA00"/>
            <rect x="1" y="9.5" width="7.5" height="7.5" fill="#00A4EF"/>
            <rect x="9.5" y="9.5" width="7.5" height="7.5" fill="#FFB900"/>
          </svg>
          Войти через Microsoft
        </button>

        <p class="signup">Нет аккаунта? <a href="../register/test_1.html">Зарегистрироваться</a></p>

      </form>
    </section>

    <!-- RIGHT: ILLUSTRATION -->
    <section class="illustration_section" aria-hidden="true">
      <img src="team.png" class="hero-image">
    </section>
  </div>
<script src="script.js"></script>
</body>
</html>
